[package]
name = "lumcoreserver"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
notify = "8.2.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
urlencoding = "2.1.3"
md-5 = "0.11.0"
sha1 = "0.11.0"
chrono = "0.4.38"
anyhow = "1.0.86"
sha2 = "0.11.0"
rustyline = "18.0.0"
hex = "0.4"